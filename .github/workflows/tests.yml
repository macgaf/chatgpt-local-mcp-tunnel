name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev,media,search]"
      - run: python -m pytest -q
      - run: python -m home_readonly_mcp.cli self-test
      - name: Archive the tested source (no .git or runtime secrets)
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip --output=tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: tested-source
          path: tested-source.zip
          retention-days: 7
