[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-local-mcp-tunnel"
version = "0.5.0"
description = "Local files, media previews, native credential storage and onboarding for ChatGPT MCP Tunnel"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
search = ["pathspec>=0.12,<1"]
media = ["Pillow>=11,<13", "pypdfium2>=4.30,<6"]
keyring = ["keyring>=25,<27"]
heif = ["pillow-heif>=0.22,<2", "Pillow>=11,<13"]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
local-mcp = "home_readonly_mcp.cli:main"
home-readonly-mcp = "home_readonly_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
