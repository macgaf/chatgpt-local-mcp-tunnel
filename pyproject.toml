[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-readonly-mcp"
version = "0.2.0"
description = "Read-only MCP server for a user's HOME directory with allow/deny policy enforcement"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.2.0",
]

[project.scripts]
home-readonly-mcp = "home_readonly_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
